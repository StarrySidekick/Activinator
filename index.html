<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Activinator</title>
<link rel="manifest" href="manifest.webmanifest">
<!-- Safari tints its own bars with this, which is the dark band above and
     below the card when the app is opened in a tab rather than installed. The
     card is the screen, so the screen's colour is the card's; deck.js swaps it
     for the ink when there is no card to be paper. -->
<meta name="theme-color" content="#F5F0E4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Activinator">
<meta name="description" content="A deck of things to actually go and do. Swipe the ones you fancy; it works out what you are like.">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="icon" href="icons/icon-32.png" sizes="32x32">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/deck.css">
<link rel="stylesheet" href="css/panels.css">
</head>
<body>
<div id="frame">
  <main id="deck"></main>
</div>
<!-- One button in the whole app, and you only meet it once you have turned a
     card over to read it. Everything else the corners used to reach was a
     quick link into this menu anyway, and four marks on the face of a
     full-bleed card were four things in front of the thing you are deciding
     about. It is the app's own mark — the two fanned cards off the icon,
     the front one cut off the back by a stroke in the colour of whatever is
     behind it. -->
<button class="settings" data-act="menu" aria-label="Menu"><svg viewBox="0 0 24 24" aria-hidden="true">
  <rect class="behind" x="7.9" y="5.4" width="8.2" height="12.4" rx="1.2" transform="rotate(17 12 17.8)"/>
  <rect class="infront" x="7.9" y="5.4" width="8.2" height="12.4" rx="1.2" transform="rotate(-13 12 17.8)"/>
</svg></button>
<div id="panelhost"></div>
<div id="toast"></div>
<script type="module" src="js/boot.js"></script>
</body>
</html>
