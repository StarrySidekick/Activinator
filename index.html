<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Activinator</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#14151c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Activinator">
<meta name="description" content="A deck of things to actually go and do. Swipe the ones you fancy; it works out what you are like.">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="icon" href="icons/icon-32.png" sizes="32x32">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/deck.css">
<link rel="stylesheet" href="css/panels.css">
</head>
<body>
<div id="frame">
  <main id="deck"></main>
  <!-- One button in each corner of a full-screen card, so none of them is ever
       in the way of the middle of it: where you go and what you look for along
       the top, what you make and what you take back along the bottom. -->
  <!-- Drawn the way the tag marks are drawn: solid silhouettes, filled evenodd,
       the shapes a suit is. The hub is the app's own mark — the two fanned
       cards off the icon, the front one cut away from the back by a stroke in
       the colour of whatever is behind it. They are hidden until you touch the
       screen; see "The dock sleeps" in the README. -->
  <nav class="dock">
    <button class="menu" data-act="menu" aria-label="Menu"><svg viewBox="0 0 24 24" aria-hidden="true">
      <rect class="behind" x="7.9" y="5.4" width="8.2" height="12.4" rx="1.2" transform="rotate(17 12 17.8)"/>
      <rect class="infront" x="7.9" y="5.4" width="8.2" height="12.4" rx="1.2" transform="rotate(-13 12 17.8)"/>
    </svg></button>
    <button class="browse" data-act="browse" aria-label="All activities"><svg viewBox="0 0 24 24" aria-hidden="true">
      <path fill-rule="evenodd" d="M10.6 2.8a7.8 7.8 0 1 0 0 15.6 7.8 7.8 0 0 0 0-15.6Zm0 2.7a5.1 5.1 0 1 1 0 10.2 5.1 5.1 0 0 1 0-10.2Z M15.7 17.2 17.5 15.4 21.8 19.7a1.3 1.3 0 0 1-1.8 1.8Z"/>
    </svg></button>
    <button class="undo" data-act="undo" aria-label="Undo"><svg viewBox="0 0 24 24" aria-hidden="true">
      <path fill-rule="evenodd" d="M3.8 13.2A8.2 8.2 0 0 1 20.2 13.2H17.4A5.4 5.4 0 0 0 6.6 13.2Z M1.9 13.2H8.5L5.2 18.9Z"/>
    </svg></button>
    <button class="add" data-act="add" aria-label="Write your own"><svg viewBox="0 0 24 24" aria-hidden="true">
      <path fill-rule="evenodd" d="M12 22.4 6.9 12.6c-1-2-.6-4.6 1-6.6L12 1.6l4.1 4.4c1.6 2 2 4.6 1 6.6Z M12 7.3a1.7 1.7 0 1 0 0 3.4 1.7 1.7 0 0 0 0-3.4Z M11.3 11.6h1.4v7.6h-1.4Z"/>
    </svg></button>
  </nav>
</div>
<div id="panelhost"></div>
<div id="toast"></div>
<script type="module" src="js/boot.js"></script>
</body>
</html>
